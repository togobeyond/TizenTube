name: Build TizenTube Standalone and Release


on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repo with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch full history for tags
          fetch-tags: true
      
      - name: Fetch tags (safety)
        run: |
          git fetch --tags --force --prune
      - name: Determine release tag
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No tags found; deriving from config.xml or fallback"
            if [ -f standalone/config.xml ]; then
              # Extract version from config.xml's version attribute
              CFG_VER=$(sed -n 's/.*version="\([^"]*\)".*/\1/p' standalone/config.xml | head -n1)
              if [ -n "$CFG_VER" ]; then
                TAG=v$CFG_VER
              else
                TAG=v0.0.0-${GITHUB_SHA:0:7}
              fi
            else
              TAG=v0.0.0-${GITHUB_SHA:0:7}
            fi
          fi
          echo "RELEASE_VERSION=$TAG" >> $GITHUB_ENV

      - name: Install modules, transpile service and build service for DIAL
        working-directory: service
        run: |
          npm install
          npx rollup -c rollup.config.js

      - name: Install modules and build the userscript
        working-directory: mods
        run: |
          npm install
          npm run build

      - name: Install modules, transpile service and build service
        working-directory: standalone/service
        run: |
          npm install
          npm install -g @vercel/ncc https://github.com/reisxd/tizen.js/tarball/main
          npm run build

      - name: Prepare Tizen Certificate
        run: |
          set -e
          if [ -n "${{ secrets.TIZEN_AUTHOR_KEY }}" ]; then
            echo "Using the release author certificate from the repository secret."
            echo "${{ secrets.TIZEN_AUTHOR_KEY }}" | base64 -d > "${GITHUB_WORKSPACE}/TizenTube-author.p12"
            echo "TIZEN_AUTHOR=${GITHUB_WORKSPACE}/TizenTube-author.p12" >> "$GITHUB_ENV"
            echo "TIZEN_AUTHOR_PW=${{ secrets.TIZEN_AUTHOR_KEY_PW }}" >> "$GITHUB_ENV"
          else
            # A fork without the release key still gets installable artifacts:
            # sign them with a throwaway certificate instead of failing the run.
            # TVs only update in place with the same certificate, so artifacts
            # from here need the old app removed first.
            echo "No release key in this repository: signing with a throwaway certificate."
            PW="ci-$(date +%s)-$RANDOM"
            tizenjs create-tizen-cert --name "TizenTube CI" --email "ci@example.com" \
              --password "$PW" --output "${GITHUB_WORKSPACE}/TizenTube-author.p12"
            echo "TIZEN_AUTHOR=${GITHUB_WORKSPACE}/TizenTube-author.p12" >> "$GITHUB_ENV"
            echo "TIZEN_AUTHOR_PW=$PW" >> "$GITHUB_ENV"
          fi

      - name: Build TizenTube Cobalt
        working-directory: standalone
        run: |
          mkdir release
          tizenjs build . -t wgt -o release/TizenTubeCobalt.wgt --author "$TIZEN_AUTHOR" --authorPwd "$TIZEN_AUTHOR_PW" -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Change config.xml to use http://tizentube:8101 as the proxy server for Cobalt
        working-directory: standalone/service
        run: |
          node build-service.js set-cobalt-proxy

      - name: Build TizenTube Cobalt with http://tizentube:8101 as the proxy server
        working-directory: standalone
        run: |
          tizenjs build . -t wgt -o release/TizenTubeCobaltTizenTubeProxyAddress.wgt --author "$TIZEN_AUTHOR" --authorPwd "$TIZEN_AUTHOR_PW" -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Remove Cobalt flags from config.xml for Old Tizen build
        working-directory: standalone/service
        run: |
          node build-service.js remove-cobalt-flags

      - name: Build TizenTube For Old Tizen (without Cobalt)
        working-directory: standalone
        run: |
          tizenjs build . -t wgt -o release/TizenTubeOld.wgt --author "$TIZEN_AUTHOR" --authorPwd "$TIZEN_AUTHOR_PW" -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Upload TizenTube package artifact for Old Tizen
        uses: actions/upload-artifact@v4
        with:
            name: app-${{ github.sha }}
            path: standalone/release/*
      
      - name: Release TizenTube Build Results
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            standalone/release/*