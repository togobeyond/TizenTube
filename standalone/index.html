<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TizenTube</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: #0b0b0e;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #f5f5f7;
            font-family: "Samsung One UI", "SamsungOneUI", Roboto, "Noto Sans", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Light from the app's own mark: two soft pools, no image, no blur filter. */
        .glow {
            position: absolute;
            top: -25%;
            left: -25%;
            width: 150%;
            height: 150%;
            pointer-events: none;
            background:
                radial-gradient(34% 38% at 50% 46%, rgba(41, 200, 245, 0.16), rgba(41, 200, 245, 0) 72%),
                radial-gradient(26% 26% at 61% 60%, rgba(94, 47, 124, 0.22), rgba(94, 47, 124, 0) 72%);
        }

        .stage {
            position: relative;
            width: 70vw;
            text-align: center;
        }

        .mark {
            display: block;
            width: 9vh;
            height: 9vh;
            margin: 0 auto 4vh;
            border-radius: 2.2vh;
            box-shadow: 0 2vh 6vh rgba(0, 0, 0, 0.55);
        }

        h1 {
            margin: 0;
            font-size: 7vh;
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.05;
        }

        .tagline {
            margin: 1.6vh 0 0;
            font-size: 2vh;
            font-weight: 400;
            letter-spacing: 0.01em;
            color: rgba(245, 245, 247, 0.55);
        }

        .track {
            position: relative;
            width: 14vw;
            height: 0.25vh;
            margin: 5vh auto 0;
            overflow: hidden;
            border-radius: 1vh;
            background: rgba(255, 255, 255, 0.14);
        }

        .bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 38%;
            height: 100%;
            border-radius: 1vh;
            background: linear-gradient(90deg, #29c8f5, #7b5cff);
            transform: translate3d(-110%, 0, 0);
            animation: slide 1.5s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
            will-change: transform;
        }

        @keyframes slide {
            from {
                transform: translate3d(-110%, 0, 0);
            }

            to {
                transform: translate3d(360%, 0, 0);
            }
        }

        .status {
            margin: 2.4vh 0 0;
            min-height: 1.4em;
            font-size: 1.7vh;
            color: rgba(245, 245, 247, 0.6);
        }

        .status.error {
            color: #ff9b9b;
        }

        .version {
            position: absolute;
            right: 4vh;
            bottom: 4vh;
            font-size: 1.4vh;
            letter-spacing: 0.06em;
            color: rgba(245, 245, 247, 0.3);
        }
    </style>
</head>

<body>
    <div class="glow"></div>
    <div class="stage">
        <img class="mark" src="icon.png" alt="">
        <h1>TizenTube</h1>
        <p class="tagline">YouTube, without the ads</p>
        <div class="track" role="progressbar" aria-label="Loading"><div class="bar"></div></div>
        <p class="status" id="status">Starting&hellip;</p>
    </div>
    <div class="version" id="version"></div>

    <script>
        "use strict";

        var statusEl = document.getElementById('status');
        var trackEl = document.querySelector('.track');
        var attempts = 0;
        // Cold boot can be slow: copying the Cobalt content and minting the
        // proxy CA key take a while on a 2018 TV, so give the service up to
        // ~2 minutes instead of failing after a few seconds.
        var MAX_ATTEMPTS = 60;
        var RETRY_MS = 2000;

        try {
            document.getElementById('version').textContent = 'v' + tizen.application.getCurrentApplication().appInfo.version;
        } catch (e) { }

        function exitApp() {
            try {
                tizen.application.getCurrentApplication().exit();
            } catch (e) {
                try { history.back(); } catch (e2) { }
            }
        }

        // Back must always leave, including on the error screen.
        document.addEventListener('tizenhwkey', function (e) {
            if (e.keyName === 'back') exitApp();
        });
        document.addEventListener('keydown', function (e) {
            if (e.keyCode === 10009 || e.keyCode === 461 || e.keyCode === 27) exitApp();
        });

        try {
            document.getElementById('version').textContent = 'v' + tizen.application.getCurrentApplication().appInfo.version;
        } catch (e) { }

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.className = isError ? 'status error' : 'status';
        }

        function showError(message) {
            trackEl.style.display = 'none';
            setStatus(message + '  Press Back, then open TizenTube again.', true);
        }

        try {
            tizen.tvinputdevice.registerKey("ColorF0Red");
            tizen.tvinputdevice.registerKey("ColorF1Green");
            tizen.tvinputdevice.registerKey("ColorF2Yellow");
            tizen.tvinputdevice.registerKey("ColorF3Blue");
        } catch (e) { }

        var keys = [
            "MediaPlayPause",
            "MediaPlay",
            "MediaPause",
            "MediaStop",
            "MediaFastForward",
            "MediaRewind",
            "MediaTrackNext",
            "MediaTrackPrevious"
        ];

        for (var i = 0; i < keys.length; i++) {
            try {
                tizen.tvinputdevice.registerKey(keys[i]);
            } catch (e) { }
        }

        var pkgId = tizen.application.getCurrentApplication().appInfo.packageId;
        var serviceId = pkgId + ".StandaloneService";

        function requestedArgs() {
            try {
                var data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
                return JSON.parse(data[0].value[0]).args;
            } catch (e) {
                return undefined;
            }
        }

        function retry(args) {
            attempts += 1;
            if (attempts >= MAX_ATTEMPTS) {
                showError("TizenTube couldn't start.");
                return;
            }
            setStatus('Waiting for the service\u2026 (' + attempts + '/' + MAX_ATTEMPTS + ')');
            setTimeout(function () {
                boot(args);
            }, RETRY_MS);
        }

        function boot(args) {
            fetch('http://localhost:8100/tizentube/getState')
                .then(function (r) {
                    return r.json();
                })
                .then(function (res) {
                    if (res.canConnectToDaemon && !res.isConnecting) {
                        setStatus('Connecting to YouTube\u2026');
                        fetch('http://localhost:8100/tizentube/debugger' + (args ? '?' + args : ''));
                        tizen.application.getCurrentApplication().exit();
                        return;
                    }
                    if (!res.canConnectToDaemon) {
                        setStatus('Loading YouTube\u2026');
                        location.href = 'http://localhost:8100/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8100%2Fdial%2Fapps%2FYouTube' + (args ? '&' + args : '');
                        return;
                    }
                    retry(args);
                })
                .catch(function () {
                    retry(args);
                });
        }

        function useInjectorOrProxy() {
            var args = requestedArgs();
            setStatus('Connecting to the service\u2026');
            boot(args);
        }

        tizen.application.launchAppControl(
            new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
            serviceId,
            useInjectorOrProxy,
            function (e) {
                showError('The service did not start' + (e && e.message ? ': ' + e.message : '') + '.');
            });
    </script>
</body>

</html>
